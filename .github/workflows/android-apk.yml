name: Build Genius APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genius-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          # پیدا کردن اولین فایل zip در ریشه‌ی ریپو (نه داخل .git)
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
          if [ -n "${ZIP:-}" ]; then
            echo "Found archive: $ZIP -> extracting into ./extracted"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
            echo "Extracted contents:"
            ls -la extracted
            # اگر داخل ZIP پوشه‌ی Genius بود، محتویاتش را بالا بیاور
            if [ -d extracted/Genius ] && [ -f extracted/Genius/settings.gradle.kts ]; then
              echo "Moving Genius/ contents to extracted/"
              shopt -s dotglob
              mv extracted/Genius/* extracted/ 2>/dev/null || true
              rmdir extracted/Genius 2>/dev/null || true
            fi
          else
            echo "No ZIP archive found; using repository files as-is."
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          # اول مسیرهای متداول، سپس داخل پوشه extracted، سپس جست‌وجوی عمیق‌تر
          if [ -f "./settings.gradle.kts" ] && [ -d "./app" ]; then
            DIR="."
          elif [ -f "./Genius/settings.gradle.kts" ]; then
            DIR="Genius"
          elif [ -f "./MindRush/settings.gradle.kts" ]; then
            DIR="MindRush"
          elif [ -f "./extracted/settings.gradle.kts" ]; then
            DIR="extracted"
          else
            CAND="$(find . -maxdepth 5 -name settings.gradle.kts -not -path './.git/*' -print -quit || true)"
            if [ -n "${CAND:-}" ]; then
              DIR="$(dirname "$CAND")"
            else
              DIR=""
            fi
          fi

          if [ -z "${DIR:-}" ] || [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found (including inside any extracted ZIP)."
            echo "Repository contents:"; ls -la
            echo "Extracted (if any):"; ls -la extracted 2>/dev/null || true
            exit 1
          fi
          echo "Using project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then echo "::error::ANDROID_HOME is not set on this runner"; exit 1; fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Wrapper JAR not shipped in the archive; generating it with Gradle 8.9."
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          test -f gradlew || { echo "::error::gradlew missing"; exit 1; }
          chmod +x gradlew
          # اطمینان از وجود local.properties خالی (اختیاری)
          if [ ! -f local.properties ]; then
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          fi

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          test -s "$APK" || { echo "::error::APK missing or empty"; exit 1; }
          cp "$APK" Genius-debug.apk
          ls -lh Genius-debug.apk
          echo "APK size: $(stat -c%s Genius-debug.apk) bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genius-debug-apk
          path: ${{ env.PROJECT_DIR }}/Genius-debug.apk
          if-no-files-found: error

      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Genius-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/*.log
            ${{ env.PROJECT_DIR }}/app/build/reports/tests
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore
